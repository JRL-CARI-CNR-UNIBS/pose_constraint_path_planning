# ik_solver node used by pose_constraints_planner for the IK of the Cartesian goals
# (get_task_redundant_ik_array and get_bounds services). Start it with
#   ros2 launch ik_solver ik_solver.launch.py config:=<this file>
# The first-level key /<namespace>/ik_solver_node gives the namespace (parameter ik_solver_ns of the planner).
/ur_ik_solver/ik_solver_node:
  ros__parameters:
    type: ik_solver/Ur10eIkSolver
    base_frame: ur10e_base_link
    flange_frame: ur10e_tool0
    tool_frame: ur10e_tool0
    desired_solutions: 32
    joint_names:
    - ur10e_shoulder_pan_joint
    - ur10e_shoulder_lift_joint
    - ur10e_elbow_joint
    - ur10e_wrist_1_joint
    - ur10e_wrist_2_joint
    - ur10e_wrist_3_joint
    min_stall_iterations: 100
    max_stall_iterations: 1000
    parallel_ik_mode: 2
    filter_duplicates: true
